            <section class="catalog-coffee">

                    <div class="catalog-coffee__filters">

                            </span> Tea

                        <button class="catalog-coffee__filter-btn" type="button" data-category="dessert">
                            <span class="catalog-coffee__filter-icon">
                                <img src="./images/catalog-coffee-icon-3.png" alt="dessert icon">
                            </span> Dessert
