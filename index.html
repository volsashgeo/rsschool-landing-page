    <!-- ХЕДЕР -->
    <header class="header">
        <div class="container header__inner">
            <a class="logo" href="#">
                <img src="./images/logo.svg" alt="Coffee House Logo" width="100" height="60" loading="lazy">
            </a>

            <nav class="header__menu hidden-tablet">
                <ul class="header__menu-list">
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">Favorite coffee</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">About</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">Mobile app</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">Contact us</a>
                    </li>
                </ul>
            </nav>

            <div class="header__block">
                <div class="header__theme-toggle">
                    <button class="header__theme-toggle__btn is-active" aria-label="Light theme">
                        <img src="./images/Light.svg" alt="Light" width="36" height="36"></button>
                    <button class="header__theme-toggle__btn" aria-label="Dark theme">
                        <img src="./images/Dark.svg" alt="Dark" width="36" height="36"></button>
                </div>

                <button class="header__button button button--transparent hidden-tablet" type="button">
                    Menu <img src="./images/coffee-cup.svg" alt="coffee-cup" width="20" height="20">
                </button>
                <button class="header__burger-button burger-button visible-tablet" type="button"
                    onclick="mobileOverlay.showModal()">
                    <span class="visually-hidden">Open navigation menu</span>
                    <img src="./images/menu-open.svg" alt="open burger button">
                </button>
            </div>
        </div>
        </div>
    </header>

    <dialog class="mobile-overlay visible-tablet" id="mobileOverlay">
        <div class="container header__inner">
            <a class="logo" href="#">
                <img src="./images/logo.svg" alt="Coffee House Logo" width="100" height="60" loading="lazy">
            </a>

            <div class="header__block">
                <div class="header__theme-toggle">
                    <button class="header__theme-toggle__btn is-active" aria-label="Light theme">
                        <img src="./images/Light.svg" alt="Light" width="36" height="36"></button>
                    <button class="header__theme-toggle__btn" aria-label="Dark theme">
                        <img src="./images/Dark.svg" alt="Dark" width="36" height="36"></button>
                </div>

                <button class="header__button button button--transparent hidden-tablet" type="button">

                    <!-- <img src="./images/menu-close.svg" alt="close burger button"> -->
                </button>
            </div>
        </div>
        <form class="mobile-overlay__close-button-wrapper" method="dialog">
            <button class="mobile-overlay__close-button cross-button" type="submit">
                <span class="visually-hidden">Close navigation menu</span>
                <img src="./images/menu-close.svg" alt="close burger button">
            </button>
        </form>
        <div class="mobile-overlay__body">
            <ul class="mobile-overlay__list">
                <li class="mobile-overlay__item">
                    <a class="mobile-overlay__link" href="/">Favorite coffee</a>
                </li>
                <li class="mobile-overlay__item">

                </li>
                <li class="mobile-overlay__item">
                    <a class="mobile-overlay__link" href="/">Mobile app</a>
                </li>
                <li class="mobile-overlay__item">

                <li class="mobile-overlay__item">
                    <button class="mobile-overlay__button button button--transparent " type="button">
                        Menu <img src="./images/coffee-cup.svg" alt="coffee-cup" width="20" height="20">
